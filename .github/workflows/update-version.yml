name: update-version

# Refreshes the pinned upstream Cassandra versions (4.1, 4.0, 5.0) by running
# update-version.sh for each, then committing and pushing the result to the
# default branch. Manual trigger only — replaces the Bitbucket "update-version"
# custom pipeline.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update upstream versions
        run: |
          for v in 4.1 4.0 5.0; do
            ./update-version.sh "$v"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream version changes to commit."
            exit 0
          fi
          # [skip ci] keeps this commit from triggering any push-based workflow.
          git commit -m "[skip ci] Updating upstream versions"
          git push
