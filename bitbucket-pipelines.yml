# ============================================================================
# DEPRECATED — DO NOT USE
#
# CI for this repository has migrated from Bitbucket Pipelines to GitHub Actions
# as part of the move to github.com/axonops. This file is retained for reference
# only and is no longer executed.
#
# Replacements:
#   update-version  -> .github/workflows/update-version.yml
#   build-images    -> .github/workflows/build-images.yml
#   Publish images  -> .github/workflows/build-images.yml (manifest job)
#
# Trigger the equivalents from the GitHub Actions tab (workflow_dispatch).
# ============================================================================
pipelines:
  custom:
    update-version:
      - step:
          script:
            - |
              for v in 4.1 4.0 5.0; do
                bash ./update-version.sh $v
              done
              git commit -m "[skip ci] Updating upstream versions"
              git push
    build-images:
      - parallel:
          steps:
            - step:
                name: Build and publish Docker images (amd64)
                image: google/cloud-sdk:alpine
                script:
                  - echo $GCLOUD_API_KEYFILE | base64 -d > ./gcloud-api-key.json
                  - cat ./gcloud-api-key.json | docker login -u _json_key --password-stdin https://europe-docker.pkg.dev
                  - IMGBASE="europe-docker.pkg.dev/axonops-public/axonops-docker/cassandra"
                  - export IMGBASE
                  - |
                    arch=amd64
                    for v in 4.1 4.0 5.0; do
                      sh ./build-image.sh $v $arch
                      docker push $IMGBASE:${v}-${arch}
                    done
                services:
                  - docker
                runs-on:
                  - linux
            - step:
                name: Build and publish Docker images (arm64)
                image: digitalisdocker/google-cloud-sdk:arm64
                script:
                  - echo $GCLOUD_API_KEYFILE | base64 -d > ./gcloud-api-key.json
                  - cat ./gcloud-api-key.json | docker login -u _json_key --password-stdin https://europe-docker.pkg.dev
                  - IMGBASE="europe-docker.pkg.dev/axonops-public/axonops-docker/cassandra"
                  - export IMGBASE
                  - |
                    arch=arm64
                    for v in 4.1 4.0 5.0; do
                      sh ./build-image.sh $v $arch
                      docker push $IMGBASE:${v}-${arch}
                    done
                services:
                  - docker
                runs-on:
                  - linux.arm64
      - step:
          name: Publish images
          image: google/cloud-sdk:alpine
          script:
            - echo $GCLOUD_API_KEYFILE | base64 -d > ./gcloud-api-key.json
            - cat ./gcloud-api-key.json | docker login -u _json_key --password-stdin https://europe-docker.pkg.dev
            - IMGBASE="europe-docker.pkg.dev/axonops-public/axonops-docker/cassandra"
            - export IMGBASE
            - |
              for v in 4.1 4.0 5.0; do
                docker manifest create $IMGBASE:${v} $IMGBASE:${v}-arm64 $IMGBASE:${v}-amd64
                docker manifest push $IMGBASE:${v}
                # docker manifest create $IMGBASE:latest $IMGBASE:${v}-arm64 $IMGBASE:${v}-amd64
                # docker manifest push $IMGBASE:latest
              done
          services:
            - docker
